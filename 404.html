<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | California Vision and Visage</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .nf_wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center;
                 justify-content:center; text-align:center; padding:40px 20px;
                 background:#0c2240; color:#ffffff; }
      .nf_wrap img { width:220px; max-width:70%; margin-bottom:40px; }
      .nf_code { font-size:64px; line-height:1; margin:0 0 12px; color:#ffffff; }
      .nf_wrap h1 { font-size:28px; margin:0 0 16px; color:#ffffff; }
      .nf_wrap p { max-width:520px; margin:0 auto 28px; opacity:.85; }
      .nf_links a { display:inline-block; margin:6px 8px; padding:12px 26px; border-radius:4px;
                    text-decoration:none; background:#1a8282; color:#ffffff; }
      .nf_links a.alt { background:transparent; border:1px solid rgba(255,255,255,.5); }
      .nf_links a:hover { background:#ffffff; color:#0c2240; }
    </style>
  </head>
  <body>
    <main class="nf_wrap">
      <img src="/assets/images/footer_logo.svg" alt="California Vision and Visage" />
      <p class="nf_code">404</p>
      <h1>We couldn't find that page</h1>
      <p>The page you are looking for may have been moved or no longer exists. Let's get you back on track.</p>
      <div class="nf_links">
        <a href="/index.html">Go to Home</a>
        <a class="alt" href="/contact-us.html">Contact Us</a>
      </div>
    </main>
  </body>
</html>
